BACKUP_ROOT=/srv/backups
DOCKER_DIR=/srv/docker
MYSQL_CONTAINER=mysql
# Optional: Logverzeichnis fuer Lauf- und Fehlerprotokolle
# Standard ohne Angabe: <projekt-root>/log
# LOG_DIR=/srv/restic/log

# Diese Listen beeinflussen nur das Stoppen/Starten von Compose-Stacks
# waehrend des Backups.
# Sie schliessen keine Daten vom Dateibackup aus.
# Das Backup kopiert weiterhin den gesamten Inhalt von DOCKER_DIR.
EXCLUDED_STACK_DIRS=(
  "/srv/docker/infrastructure/gotify"
  "/srv/docker/apps/immich-app"
  "/srv/docker/nextcloud"
  "/srv/docker/apps/vaultwarden"
)

MYSQL_INSTANCES=(
#  "mysql:backup:PROD_DB_PASSWORD:3306" # PROD_DB_PASSWORD in .env definieren
  "nextcloud:nextcloud:NEXTCLOUD_DB_PW"
#  "mysql-dev:root:rootpass"                 # Klartext weiterhin moeglich
#  "mysql-legacy"                            # Nutzt Standardwerte
)

EXCLUDED_CONTAINER_NAMES=(
  "stirlingpdf-stirling-pdf-1"
  "ntp"
  "gotify"
  "caddy"
  "ctop"
  "watchtower"
  "ntp"
  "excalidraw"
  "nextcloud-app"
  "nextcloud-cron"
  "nextcloud-db"
  "nextcloud-redis"

)
RESTIC_TAG=docker-backup
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=6

# Anzahl lokaler Snapshot-Ordner in BACKUP_ROOT, die aufbewahrt werden.
# Wird jetzt auch nach einem Abbruch angewendet (EXIT-Trap).
# 2 = der letzte vollstaendige Lauf bleibt erhalten, waehrend der neue entsteht.
KEEP_LOCAL_BACKUPS=2

# Mindestens noetiger freier Speicher in BACKUP_ROOT (in MB), sonst Abbruch
# vor dem Kopieren. Nach dem naechsten erfolgreichen Lauf an die reale
# Backup-Groesse anpassen (steht in der Gotify-Erfolgsmeldung unter "Groesse").
# 0 deaktiviert die Pruefung.
MIN_FREE_LOCAL_MB=61440

# rclone-Remote-Name fuer Internxt-Sync
INTERNXT_RCLONE_REMOTE="internxt"

# Nextcloud-spezifisch
# Dump-Befehl fuer die Nextcloud-DB (Standard: Autodetection mariadb-dump > mysqldump)
# NEXTCLOUD_DB_DUMP_CMD=mariadb-dump
NEXTCLOUD_APP_CONTAINER="nextcloud-app"
NEXTCLOUD_DB_CONTAINER="nextcloud-db"
NEXTCLOUD_DB_USER="nextcloud"
NEXTCLOUD_DB_PASSWORD="${NEXTCLOUD_DB_PW}"
NEXTCLOUD_DB_NAME="nextcloud"
NEXTCLOUD_DATA_DIR="/srv/docker/apps/nextcloud/data/nextcloud"
